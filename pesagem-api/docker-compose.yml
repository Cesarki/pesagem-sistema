version: '3.8'

services:
  web:
    image: php:8.1-apache
    container_name: pesagem-web
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html
      - ./src:/var/www/src
      - ./config:/var/www/config
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=pesagem_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db
    networks:
      - pesagem-network

  db:
    image: postgres:14-alpine
    container_name: pesagem-db
    environment:
      POSTGRES_DB: pesagem_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - pesagem-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pesagem-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pesagem.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - pesagem-network

volumes:
  postgres_data:

networks:
  pesagem-network:
    driver: bridge
